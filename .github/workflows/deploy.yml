# .github/workflows/deploy.yml
name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd ${{ secrets.HOSTINGER_STAGING_PATH }}
            
            # Put app into maintenance mode
            php artisan down || true
            
            # Fetch latest changes from staging
            git fetch origin staging
            git reset --hard origin/staging
            
            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Run database migrations
            php artisan migrate --force
            
            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # Ensure storage link exists
            php artisan storage:link || true

            # Restart queue workers so they stop executing the previous release's
            # code (a live worker holds the old classes in memory, so mail and SMS
            # jobs fail or run against code that is no longer on disk)
            php artisan queue:restart || true
            
            # Bring app back online
            php artisan up

  deploy-production:
    name: Deploy to Production
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd ${{ secrets.HOSTINGER_PROD_PATH }}
            
            # Put app into maintenance mode
            php artisan down || true
            
            # Fetch latest changes from main
            # reset --hard, not pull: a pull silently aborts on any local change
            # on the server checkout and the deploy still reports success while
            # running the old code. .env and storage/ are untracked/ignored, so
            # they survive a reset.
            git fetch origin main
            git reset --hard origin/main
            
            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Run database migrations
            php artisan migrate --force
            
            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # Ensure storage link exists
            php artisan storage:link || true

            # Restart queue workers so they stop executing the previous release's
            # code (a live worker holds the old classes in memory, so mail and SMS
            # jobs fail or run against code that is no longer on disk)
            php artisan queue:restart || true
            
            # Bring app back online
            php artisan up
